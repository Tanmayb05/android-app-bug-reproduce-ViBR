# ViBR Configuration -- variant C (emulator-5558)
# Full standalone config. Only `runs`, `adb.device_id`, and
# `adb.ui_dump_local_path` differ from config.yml and the other variants.

# Available app_name values:

# amazefilemanager1, amazefilemanager2, ankidroid1, k91, k92, wordpress
# Only the first uncommented entry is processed per run.
